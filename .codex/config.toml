model_provider = "amazon-bedrock"
forced_login_method = "api"
check_for_update_on_startup = false
commit_attribution = ""
chatgpt_base_url = "http://127.0.0.1:9"
approvals_reviewer = "auto_review"
model_reasoning_effort = "high"
model = "openai.gpt-5.6-sol"
# Regenerate after Codex updates: ~/.dotfiles/.codex/generate-bedrock-1m-model-catalog.sh
model_context_window = 1048576
model_auto_compact_token_limit = 800000
model_catalog_json = "~/.codex/model_catalog.json"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[mcp_servers.builder-mcp]
args = [
    "--include-tools",
    "*",
    "--exclude-tools",
    "SkillsTool,WorkspaceSearch,Delegate,ToolReactivationTool",
]
command = "builder-mcp"

[mcp_servers.builder-mcp.env]
TOOL_PERSONALIZATION_ENABLED = "false"
TOOL_PERSONALIZATION_MIN_EXECUTIONS = "0"
TOOL_PERSONALIZATION_ROLLOUT_PERCENTAGE = "100"
TOOL_PERSONALIZATION_TRAINING_DAYS = "0"

[mcp_servers.builder-mcp.tools.CodeReviewReadActions]
approval_mode = "approve"

[shell_environment_policy]
inherit = "all"

[analytics]
enabled = true

[feedback]
enabled = false

[otel]
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"
log_user_prompt = true
environment = "stable"

[model_providers.amazon-bedrock.aws]
region = "us-east-2"

[marketplaces.aim]
source_type = "local"
source = "/Users/luchay/.aim/plugins/codex"

[plugins."AIPowerUserCapabilities-comms@aim"]
enabled = false

[plugins."AIPowerUserCapabilities-writing@aim"]
enabled = false

[plugins."AIPowerUserCapabilities-research@aim"]
enabled = false

[plugins."AIPowerUserCapabilities-core-dev@aim"]
enabled = false

[plugins."AIPowerUserCapabilities-code-review@aim"]
enabled = true

[plugins."AmazonBuilderCoreAIAgents-pipeline-assistant@aim"]
enabled = false

[plugins."AmazonBuilderCoreAIAgents-core@aim"]
enabled = true

[plugins."AtlasAICapabilities-all@aim"]
enabled = true

[plugins."ChorusAIM-all@aim"]
enabled = true

[plugins."EC2KiroMISExpert-all@aim"]
enabled = true

[plugins."MeshClawAICapabilities-all@aim"]
enabled = true

[plugins."MfArbalestAICapabilities-arbalest@aim"]
enabled = true

[features]
memories = true
default_mode_request_user_input = true

[notice]
hide_full_access_warning = true

[tui]
status_line = ["current-dir", "git-branch", "project-name", "model-with-reasoning", "context-used", "branch-changes", "task-progress", "run-state", "approval-mode"]
status_line_use_colors = true
session_picker_view = "dense"
pet = "disabled"

[projects."/Volumes/workplace/TouchlessDNSService/src/TouchlessDNSService"]
trust_level = "trusted"
